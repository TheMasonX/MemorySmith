name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Validate task records
        shell: pwsh
        run: ./Scripts/Test-TaskRecords.ps1

      - name: Validate memory records
        shell: pwsh
        run: ./Scripts/Test-MemoryRecords.ps1

      - name: Validate page links
        shell: pwsh
        run: ./Scripts/Test-PageLinks.ps1

      - name: Validate page path literals
        shell: pwsh
        run: ./Scripts/Test-PagePathLiterals.ps1

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test MemorySmith.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Generate coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"artifacts/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"artifacts/coverage-report" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"
          cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cobertura coverage
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-coverage
          path: |
            artifacts/TestResults/**/coverage.cobertura.xml
            artifacts/coverage-report/Cobertura.xml
          if-no-files-found: error

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: artifacts/coverage-report
          if-no-files-found: error

  browser-route-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run route-smoke browser regression
        working-directory: e2e
        run: npm run test:route-smoke

      - name: Upload route-smoke artifacts
        if: always()
        id: upload-route-smoke-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-route-smoke-artifacts
          path: artifacts/browser-validation/route-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Upload route-smoke diagnostics
        if: failure()
        id: upload-route-smoke-diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: browser-route-smoke-diagnostics
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize route-smoke artifacts
        if: always()
        shell: bash
        run: |
          echo "## Browser route smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: [browser-route-smoke-artifacts](${{ steps.upload-route-smoke-artifacts.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.upload-route-smoke-diagnostics.outputs.artifact-url }}" ]; then
            echo "- Diagnostics: [browser-route-smoke-diagnostics](${{ steps.upload-route-smoke-diagnostics.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/browser-validation/route-smoke/manifest.json ]; then
            echo "- Manifest path: artifacts/browser-validation/route-smoke/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  browser-navigation-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run navigation-freeze browser regression
        working-directory: e2e
        run: npm run test:nav-freeze

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-navigation-freeze-diagnostics
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
